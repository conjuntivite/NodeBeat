# Uso: docker compose -f deploy/compose.yml --env-file deploy/.env up -d --build
# Só o `web` publica portas; mongo/redis/api/worker ficam só na rede interna do compose.
name: nodebeat

x-env: &env
  NODEBEAT_MONGO_URL: ${NODEBEAT_MONGO_URL:?}
  NODEBEAT_REDIS_URL: ${NODEBEAT_REDIS_URL:?}
  NODEBEAT_SECRET_KEY: ${NODEBEAT_SECRET_KEY:?}
  NODEBEAT_REFERENCE_HOST: ${NODEBEAT_REFERENCE_HOST:?}
  NODEBEAT_WEBHOOK_URL: ${NODEBEAT_WEBHOOK_URL:?}
  NODEBEAT_WEBHOOK_TOKEN: ${NODEBEAT_WEBHOOK_TOKEN:-}

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: nodebeat
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?}
    volumes: [mongo-data:/data/db]

  # Redis >= 7: o limite de login usa EXPIRE NX
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?}"]
    volumes: [redis-data:/data]

  api:
    build: ../backend
    restart: unless-stopped
    # forwarded-allow-ips = rede interna do compose (só o nginx chega aqui); ajuste se a sub-rede mudar
    command: ["uvicorn", "--factory", "nodebeat.api:app_from_env", "--host", "0.0.0.0", "--port", "8000",
              "--proxy-headers", "--forwarded-allow-ips", "172.16.0.0/12"]
    environment: *env
    depends_on: [mongo, redis]

  worker:
    build: ../backend
    restart: unless-stopped
    command: ["python", "-m", "nodebeat.worker"]
    cap_add: [NET_RAW]
    environment: *env
    depends_on: [mongo, redis]

  web:
    build: ../frontend
    restart: unless-stopped
    ports:
      - "${NODEBEAT_BIND_IP:?}:443:443"
      - "${NODEBEAT_BIND_IP:?}:80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on: [api]

volumes:
  mongo-data:
  redis-data:
