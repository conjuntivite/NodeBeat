[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nodebeat"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn",
  "motor",
  "redis",
  "librouteros",
  "cryptography",
  "argon2-cffi",
  "httpx",
  "tzdata",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "fakeredis", "mongomock-motor"]

[tool.setuptools]
packages = ["nodebeat"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
