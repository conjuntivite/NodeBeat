server {
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    ssl_certificate     /etc/nginx/certs/nodebeat.crt;
    ssl_certificate_key /etc/nginx/certs/nodebeat.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # Extras mínimos do Flutter web (CanvasKit):
    #  script-src 'wasm-unsafe-eval' : compilar o WebAssembly do CanvasKit
    #  style-src 'unsafe-inline'     : o engine injeta um <style> na página
    #  img-src data: blob:           : imagens decodificadas em memória
    #  font-src data:                : fontes embutidas/decodificadas em memória
    #  connect-src cai em default-src 'self' (API e CanvasKit vêm do mesmo host)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:" always;

    root /usr/share/nginx/html;
    index index.html;

    # DNS do docker, reresolvido a cada 10 s (o IP da api muda se o container recriar)
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        # com variável e sem URI no proxy_pass, a URI original (/api/... e query) segue intacta
        set $api http://api:8000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
