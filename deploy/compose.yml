# Uso: docker compose -f deploy/compose.yml --env-file deploy/.env up -d --build
# Só o `web` publica portas; mongo/redis/api/worker ficam só na rede interna do compose.
name: nodebeat

x-env: &env
  # URLs montadas aqui a partir das senhas (usuário nodebeat; o nome do banco /nodebeat é obrigatório)
  NODEBEAT_MONGO_URL: mongodb://nodebeat:${MONGO_PASSWORD:?}@mongo:27017/nodebeat?authSource=admin
  NODEBEAT_REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
  NODEBEAT_SECRET_KEY: ${NODEBEAT_SECRET_KEY:?}
  NODEBEAT_REFERENCE_HOST: ${NODEBEAT_REFERENCE_HOST:?}
  NODEBEAT_WEBHOOK_URL: ${NODEBEAT_WEBHOOK_URL:?}
  NODEBEAT_WEBHOOK_TOKEN: ${NODEBEAT_WEBHOOK_TOKEN:-}

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: nodebeat
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?}
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1})"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis >= 7: o limite de login usa EXPIRE NX
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?}   # evita a senha na linha de comando do healthcheck
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ../backend
    restart: unless-stopped
    # forwarded-allow-ips = rede interna do compose (só o nginx chega aqui); ajuste se a sub-rede mudar
    command: ["uvicorn", "--factory", "nodebeat.api:app_from_env", "--host", "0.0.0.0", "--port", "8000",
              "--proxy-headers", "--forwarded-allow-ips", "172.30.0.0/24"]
    cap_drop: [ALL]
    environment: *env
    depends_on:
      mongo: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    build: ../backend
    restart: unless-stopped
    command: ["python", "-m", "nodebeat.worker"]
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    environment: *env
    depends_on:
      mongo: {condition: service_healthy}
      redis: {condition: service_healthy}

  web:
    build: ../frontend
    restart: unless-stopped
    # sem cap_drop: o nginx como root precisa de CHOWN/SETUID/SETGID/NET_BIND_SERVICE e não dá para testar aqui
    ports:
      - "${NODEBEAT_BIND_IP:?}:443:443"
      - "${NODEBEAT_BIND_IP:?}:80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on: [api]

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24   # se colidir com a rede da VM, troque aqui e em --forwarded-allow-ips da api

volumes:
  mongo-data:
  redis-data:
